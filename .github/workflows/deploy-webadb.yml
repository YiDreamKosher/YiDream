name: Deploy YiDream client site and Android console

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'version.json'
      - '.github/workflows/deploy-webadb.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_signed: ${{ steps.signing.outputs.release_signed }}
      version_tag: ${{ steps.version.outputs.tag }}
    env:
      RELEASE_SIGNING: ${{ secrets.YIDREAM_KEYSTORE_BASE64 != '' && secrets.YIDREAM_KEY_ALIAS != '' && secrets.YIDREAM_KEY_PASSWORD != '' && secrets.YIDREAM_STORE_PASSWORD != '' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        run: |
          python3 - <<'PYVERSION'
          import json, os, re
          from pathlib import Path
          manifest = json.loads(Path("version.json").read_text())
          gradle = Path("app/build.gradle").read_text()
          code = re.search(r"versionCode\s+(\d+)", gradle)
          name = re.search(r'versionName\s+"([^\"]+)"', gradle)
          if not code or not name or manifest.get("versionCode") != int(code[1]) or manifest.get("versionName") != name[1]:
              raise SystemExit("Android and manifest versions must match before publication.")
          tag = manifest["versionName"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Invalid release tag.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("tag=" + tag + "\n")
          PYVERSION

      - name: Vérifier la signature avant publication
        id: signing
        run: |
          echo "release_signed=$RELEASE_SIGNING" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_SIGNING" != "true" ]; then
            echo "::notice::Clé de signature durable absente : compilation de test uniquement. Le site et sa mise à jour ne seront pas remplacés par une APK signée avec une clé debug éphémère."
          fi

      - name: Vérifier la séparation YiDream et YZ
        run: |
          python3 tests/check-project-boundaries.py
          python3 -m unittest discover -s tests -p '*_test.py'

      # --- Compilation de l'APK Android, pour le bundler dans le site ---
      - name: Installer Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences du SDK Android préinstallé
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Générer le gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Tester la vérification des mises à jour
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Conserver les captures et contrôles des écrans
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yidream-ui-previews
          path: |
            app/build/ui-previews
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Préparer la clé de signature
        if: env.RELEASE_SIGNING == 'true'
        env:
          YIDREAM_KEYSTORE_BASE64: ${{ secrets.YIDREAM_KEYSTORE_BASE64 }}
        run: echo "$YIDREAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yidream-release.jks"

      - name: Compiler l'APK signé
        if: env.RELEASE_SIGNING == 'true'
        env:
          ORG_GRADLE_PROJECT_yidreamStoreFile: ${{ runner.temp }}/yidream-release.jks
          ORG_GRADLE_PROJECT_yidreamStorePassword: ${{ secrets.YIDREAM_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_yidreamKeyAlias: ${{ secrets.YIDREAM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_yidreamKeyPassword: ${{ secrets.YIDREAM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Compiler l'APK installable de prévisualisation
        if: env.RELEASE_SIGNING != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copier l'APK dans le site
        run: |
          if [ "$RELEASE_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk webadb/public/yidream.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk webadb/public/yidream.apk
          fi

      - name: Vérifier la signature de production conservée
        if: env.RELEASE_SIGNING == 'true'
        run: python3 tests/verify-apk-certificate.py webadb/public/yidream.apk signing-certificate.sha256

      - name: Décrire le type de signature pour le site
        run: |
          if [ "$RELEASE_SIGNING" = "true" ]; then
            echo '{"releaseSigned":true}' > webadb/public/yidream-build.json
          else
            echo '{"releaseSigned":false}' > webadb/public/yidream-build.json
          fi

      - name: Générer le manifeste avec l'empreinte de l'APK
        run: |
          sha256sum webadb/public/yidream.apk | cut -d ' ' -f1 > "$RUNNER_TEMP/yidream-apk.sha256"
          jq --rawfile apkSha "$RUNNER_TEMP/yidream-apk.sha256" --arg apkUrl 'https://yidreamkosher.github.io/YiDream/admin/yidream.apk' '.apkUrl = $apkUrl | .apkSha256 = ($apkSha | gsub("\n"; ""))' version.json > "$RUNNER_TEMP/version.json"

      - name: Publier l'APK dans les artefacts GitHub Actions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yidream-${{ env.RELEASE_SIGNING == 'true' && 'release' || 'preview' }}-${{ steps.version.outputs.tag }}-${{ github.run_attempt }}
          path: webadb/public/yidream.apk
          if-no-files-found: error

      # --- Compilation et déploiement des deux espaces ---
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Installer les dépendances
        working-directory: webadb
        run: npm ci

      - name: Compiler le site administrateur
        working-directory: webadb
        run: npm run build

      - name: Assembler le site public et la console Android
        run: |
          mv webadb/dist "$RUNNER_TEMP/yidream-admin"
          mkdir -p webadb/dist/admin webadb/dist/icons
          cp -R "$RUNNER_TEMP/yidream-admin/." webadb/dist/admin/
          cp site/client/index.html webadb/dist/index.html
          cp webadb/assets/icons/yidream-original.png webadb/dist/icons/yidream-original.png
          cp "$RUNNER_TEMP/version.json" webadb/dist/version.json

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: webadb/dist

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/yidream-release.jks"

  release:
    needs: build
    if: needs.build.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yidream-release-${{ needs.build.outputs.version_tag }}-${{ github.run_attempt }}
          path: release

      - name: Publish the signed Android release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.version_tag }}
          target_commitish: ${{ github.sha }}
          name: YiDream ${{ needs.build.outputs.version_tag }}
          body: |
            Configure MP3 and Qin app profiles from YiDream Suite.
            Request access to a website for 24 hours or until a selected trip end time.
            The YiDream reader closes temporary access when it expires.
            Previously approved phones can open YiDream offline and queue website and app access requests.
            An optional Quick Settings tile can replace the home screen launcher icon.
            YiDream disables USB and Wi-Fi debugging after authorized device activation.
            Managed phones block manual APK installation and hide detected app stores.
            YiDream can update itself and already installed approved apps through the verified update channels.
            If the previous filter prevents the first upgrade, use administrator filter removal and prepare the phone again in WebADB.
          files: release/yidream.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [build, release]
    if: needs.build.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
